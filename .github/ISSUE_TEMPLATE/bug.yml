name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴本机绝对路径、ChatCut 工程 ID、凭据或版权素材。
  - type: dropdown
    id: route
    attributes:
      label: 入口模式
      options: [快速链接, 专业本地, 原创规划, Skill 安装, 展示站]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 1.2.0
    validations: { required: true }
